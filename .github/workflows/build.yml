name: Build C2000 Max Firmware

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build (清除所有缓存重新编译)'
        type: boolean
        default: false
        required: false

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  REPO_BRANCH: mt798x-mt799x-6.6-mtwifi
  CONFIG_FILE: defconfig/mt7987_mt7992.config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up build environment
        run: |
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils \
            bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged \
            help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo pip3 install pyelftools --break-system-packages
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth=1 --branch ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} immortalwrt
          echo "SOURCE_DIR=$PWD/immortalwrt" >> $GITHUB_ENV

      - name: Apply base defconfig
        working-directory: immortalwrt
        run: |
          cp -f ${{ env.CONFIG_FILE }} .config
          make defconfig

      - name: Run pre-build customization (diy-part1.sh)
        working-directory: immortalwrt
        run: |
          if [ -f ../diy-part1.sh ]; then
            bash ../diy-part1.sh
          fi

      - name: Update and install feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply custom packages via seed config
        working-directory: immortalwrt
        run: |
          # Apply custom package selections
          if [ -f ../configs/c2000max-packages.seed ]; then
            cat ../configs/c2000max-packages.seed >> .config
            make defconfig
          fi

      - name: Restore MT7992 WiFi7 chip config (fix FIRST_IF_NONE reset)
        working-directory: immortalwrt
        run: |
          # make defconfig 会把 MTK_WIFI7 整组配置重置：
          #   MT_WIFI=m          -> not set       => obj-$(CONFIG_MT_WIFI) 为空 => mt_wifi.ko 不生成
          #   FIRST_IF_MT7992=y  -> FIRST_IF_NONE=y => CHIPSET 为空
          # 结果 kmod-mt_wifi7 打包时报 "module mt_wifi.ko is missing"。
          # 此处以 defconfig 的 MTK_WIFI7 全量配置为准，强制回写后再 oldconfig。

          echo "=== Before fix ==="
          grep -E "^CONFIG_MTK_WIFI7_(MT_WIFI|MT_WIFI_PATH|CHIP_MT7992|FIRST_IF_MT7992|SECOND_IF_MT7992)=|^# CONFIG_MTK_WIFI7_(MT_WIFI|FIRST_IF_MT7992) is not set" .config || true

          # 1) 从 defconfig 提取所有 MTK_WIFI7 相关配置行（含 =y/=m/字符串/=数值）
          grep -E "^CONFIG_MTK_WIFI7_[A-Z0-9_]+=" defconfig/mt7987_mt7992.config > /tmp/wifi7-forced.conf || true
          # 2) 从 defconfig 提取明确未设置的项
          grep -E "^# CONFIG_MTK_WIFI7_[A-Z0-9_]+ is not set" defconfig/mt7987_mt7992.config > /tmp/wifi7-unset.conf || true

          echo "从 defconfig 提取 $(wc -l < /tmp/wifi7-forced.conf) 条 MTK_WIFI7 配置"

          # 3) 清掉 .config 中现有的 MTK_WIFI7 配置
          sed -i '/^CONFIG_MTK_WIFI7_[A-Z0-9_]*=/d' .config
          sed -i '/^# CONFIG_MTK_WIFI7_[A-Z0-9_]* is not set/d' .config

          # 4) 回写 defconfig 的权威值
          cat /tmp/wifi7-forced.conf >> .config
          cat /tmp/wifi7-unset.conf >> .config 2>/dev/null || true

          # 5) 用 oldconfig 收敛（不能用 defconfig，会再次重置）
          yes "" | make oldconfig > /dev/null 2>&1 || true

          echo "=== After fix ==="
          grep -E "^CONFIG_MTK_WIFI7_(MT_WIFI|MT_WIFI_PATH|CHIP_MT7992|FIRST_IF_MT7992|SECOND_IF_MT7992)=|^# CONFIG_MTK_WIFI7_(MT_WIFI|FIRST_IF_MT7992) is not set" .config

          # 6) 硬性校验：MT_WIFI 必须为 m（模块），芯片必须为 MT7992
          echo "=== Verify ==="
          grep -q '^CONFIG_MTK_WIFI7_MT_WIFI=m' .config || { echo "FATAL: CONFIG_MTK_WIFI7_MT_WIFI=m 缺失"; exit 1; }
          grep -q '^CONFIG_MTK_WIFI7_FIRST_IF_MT7992=y' .config || { echo "FATAL: FIRST_IF_MT7992 缺失"; exit 1; }
          grep -q '^CONFIG_MTK_WIFI7_CHIP_MT7992=y' .config || { echo "FATAL: CHIP_MT7992 缺失"; exit 1; }
          echo "OK: WiFi7 芯片配置已恢复"

      - name: Drop duplicate ndisc6 from qmodem feed
        working-directory: immortalwrt
        run: |
          # qmodem feed 与 mtk 5g-modem 各带一份 ndisc6，qmodem 版本在 aarch64 上
          # rdisc6 二进制编译不出来，打包时报 install: cannot stat .../rdisc6。
          # mtk 的 5g-modem/ndisc 版本可正常编译，因此禁用 qmodem 的重复包。
          if [ -d feeds/qmodem/ndisc6 ]; then
            echo "禁用 feeds/qmodem/ndisc6"
            rm -rf feeds/qmodem/ndisc6
          fi
          # 同时从 .config 中移除以 feeds/qmodem 来源的 ndisc6 包选择
          sed -i '/^CONFIG_PACKAGE_ndisc6=y/d' .config || true
          sed -i '/^CONFIG_PACKAGE_rdisc6=y/d' .config || true
          echo "ndisc6 去重完成"

      - name: Run post-build customization (diy-part2.sh)
        working-directory: immortalwrt
        run: |
          if [ -f ../diy-part2.sh ]; then
            bash ../diy-part2.sh
          fi

      - name: Show final configuration summary
        working-directory: immortalwrt
        run: |
          echo "======= Target Configuration ======="
          grep -E "^CONFIG_TARGET_BOARD|^CONFIG_TARGET_SUBTARGET|^CONFIG_TARGET_PROFILE|^CONFIG_TARGET_ARCH" .config
          echo ""
          echo "======= Key Packages ======="
          grep -E "^CONFIG_PACKAGE_luci-app-openclash|^CONFIG_PACKAGE_luci-app-adguardhome|^CONFIG_PACKAGE_luci-app-samba4|^CONFIG_PACKAGE_luci-app-aria2|^CONFIG_PACKAGE_qmodem" .config || echo "(some packages may not be visible yet)"

      - name: Download package sources
        working-directory: immortalwrt
        run: |
          make download -j$(nproc) || make download -j1 V=s

      - name: Build firmware
        working-directory: immortalwrt
        run: |
          make -j$(nproc) V=s || make -j1 V=s

      - name: Package firmware artifacts
        id: package
        run: |
          mkdir -p release
          SOURCE_DIR="${{ env.SOURCE_DIR }}"
          TARGET_DIR="${SOURCE_DIR}/bin/targets/mediatek/filogic"

          echo "Looking for firmware files in: $TARGET_DIR"

          # Copy all firmware files (factory, sysupgrade, etc.)
          find "$TARGET_DIR" -maxdepth 1 -type f \( -name "*.bin" -o -name "*.itb" -o -name "*.ubi" -o -name "*.img.gz" -o -name "*.tar.gz" \) -exec cp {} release/ \; 2>/dev/null || true

          # Copy packages
          find "$TARGET_DIR" -name "packages" -type d | while read pkgdir; do
            cp -r "$pkgdir" release/packages 2>/dev/null || true
          done

          # Copy sha256sums and manifest
          cp "$TARGET_DIR"/sha256sums release/ 2>/dev/null || true
          cp "$TARGET_DIR"/*manifest* release/ 2>/dev/null || true

          # Generate build info
          {
            echo "Build Time: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "Source Repo: ${{ env.REPO_URL }}"
            echo "Source Branch: ${{ env.REPO_BRANCH }}"
            echo "Config Base: ${{ env.CONFIG_FILE }}"
            echo ""
            echo "=== Target Info ==="
            grep -E "^CONFIG_TARGET_BOARD|^CONFIG_TARGET_SUBTARGET|^CONFIG_TARGET_PROFILE|^CONFIG_TARGET_ARCH_PACKAGES|^CONFIG_LINUX" ${SOURCE_DIR}/.config
          } > release/BUILD_INFO.txt

          # List all output files
          echo "======= Generated Files ======="
          ls -lh release/
          echo "files=$(ls release/ | tr '\n' ' ')" >> $GITHUB_ENV

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: C2000Max-ImmortalWrt-Firmware
          path: release/*
          retention-days: 30

      - name: Build summary
        run: |
          echo "✅ Build completed!"
          echo "Download the firmware from the 'Artifacts' section of this workflow run."
          echo ""
          echo "📁 Firmware files location: release/"
          ls -lh release/
